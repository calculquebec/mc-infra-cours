jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 1.0
      def: 5.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 1
    memory:
      min: 1024
      max: 15000
      def: 2048
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
    partition:
      lock: false
  SlurmFormSpawner:
    disable_form: true

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'
  - 'gcc'
  - 'mii'

jupyterhub::kernel::venv::packages: ['numpy', 'pandas', 'matplotlib', 'seaborn', 'plotly']

profile::accounts::skel_archives:
  - filename: cache.zip
    source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
  - filename: jupyter.zip
    source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1.0.1/jupyter-v1.0.1.zip

cron::job:
  spawn_nodes:
    command: '/opt/software/slurm/bin/scontrol update node=nodecpupool[1-2] state=power_up'
    hour: '8'
    minute: '10'
    weekday: '4'
    month: '9-12'
    user: 'root'
    description: 'spawn nodes at 08:10 on each Thursday'
    environment: ['CRON_TZ=America/New_York']
