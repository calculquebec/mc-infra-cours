jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 1.0
      def: 5.0
      max: 8.0
    nprocs:
      min: 1
      def: 4
      max: 4
    memory:
      min: 1024
      max: 8096
      def: 8096
    oversubscribe:
      def: false
      lock: true
    ui:
      def: 'lab'
    partition:
      lock: false
  SlurmFormSpawner:
    disable_form: true

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'
  - 'gcc'
  - 'mii'
  - 'udunits/2.2.28'
  - 'hdf/4.2.16'
  - 'gdal/3.7.2'
  - 'r/4.4.0'
  - 'rstudio-server/4.4'

jupyterhub::kernel::venv::packages: ['numpy', 'pandas', 'matplotlib', 'seaborn', 'plotly']
profile::software_stack::extra_site_env_vars:
  R_LIBS: '/project/def-sponsor00/R/4.4.0'

profile::accounts::skel_archives:
  - filename: cache.zip
    source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
  - filename: jupyter.zip
    source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1.0.1/jupyter-v1.0.1.zip

cron::job:
  spawn_nodes:
    command: '/opt/software/slurm/bin/scontrol update node=ALL state=power_up'
    hour: '8'
    minute: '50'
    date: '10'
    month: '12'
    user: 'root'
    description: 'spawn nodes at 08:50 on Wednesday Dec. 10th'
    environment: ['CRON_TZ=America/New_York']
