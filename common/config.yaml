jupyterhub::enable_otp_auth: false

lookup_options:
  jupyterhub::kernel::venv::pip_environment:
    merge: deep
  jupyterhub::jupyterhub_config_hash:
    merge: deep
  profile::accounts::skel_archives:
    merge: deep
  profile::users::ldap::users:
    merge: deep
  profile::software_stack::lmod_default_modules:
    merge: deep

# StdEnv/2023 and mii are automatically loaded
profile::software_stack::lmod_default_modules:
  - jupyterlab-apps/1.0

jupyterhub::node::install_method: 'none'
jupyterhub::node::prefix: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Core/jupyterhub_node/7.2.1
jupyterhub::kernel::venv::kernel_name: 'ospython'
jupyterhub::kernel::venv::display_name: 'Python bundle'
jupyterhub::jupyter_notebook_config_hash:
  ServerApp:
    allow_origin: "https://jupyter.%{lookup('terraform.data.domain_name')}"

jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 3.5
      def: 4.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 1
    memory:
      min: 1024
      max: 2048
      def: 2048
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
  SlurmFormSpawner:
    start_timeout: 900
    http_timeout: 300
    ui_args:
      lab:
        modules: ['jupyterlab-apps']
jupyterhub::admin_groups: ['admins']

metrix::slurm_password: ENC[PKCS7,]
profile::freeipa::mokey::require_verify_admin: true

profile::nfs::server::enable_client_quotas: true
# when using snapshots, it is quick enough to boot nodes that 900 seconds is enough for suspend
profile::slurm::base::suspend_time: 900
profile::slurm::base::resume_timeout: 900
profile::slurm::base::suspend_rate: 80
profile::slurm::base::resume_rate: 80

prometheus::storage_retention: '14d'


jupyterhub::kernel::venv::pip_environment:
  PIP_NO_INDEX: 1

prometheus::global_config:
  scrape_interval: '1m'
  scrape_timeout: '1m'
  external_labels:
    cluster: "%{alias('cluster_name')}"
    cloud: "%{alias('cloud_name')}"
    team: 'calculquebec'
    purpose: "%{alias('cluster_purpose')}"
    replica: '1'

prometheus::remote_write_configs:
  - url: 'https://thanos-receive.dant.computecanada.ca/api/v1/receive'
    basic_auth:
      username: 'cqformation'
      password: "%{alias('prometheus_password')}"


magic_castle::site::tags:
  cron:
    - cron

profile::mail::dkim::private_key: "%{alias('dkim_key')}"

# encrypted secrets
dkim_key: ENC[PKCS7,]

profile::users::ldap::users:
  'mboisson':
    count: 1
    passwd: ENC[PKCS7,]
    groups: ['def-sponsor00', 'admins']
  'helene':
    count: 1
    passwd: ENC[PKCS7,]
    groups: ['def-sponsor00', 'admins']

yum_cron::apply_updates: true
yum_cron::mailto: ENC[PKCS7,]
yum_cron::reboot_command: "test $(/opt/software/slurm/bin/squeue | wc -l) -eq 1 && shutdown -r +1 'Cluster is idle. Rebooting after applying package updates'"
