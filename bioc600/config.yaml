jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    runtime:
      min: 3.5
      def: 3.5
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 8
    memory:
      min: 1024
      max: 30000
      def: 2048
    oversubscribe:
      def: true
      lock: false
    ui:
      def: 'lab'
  SlurmFormSpawner:
    disable_form: false

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'
  - 'gcc'
  - 'mii'
  - 'bwa'
  - 'samtools'
  - 'picard'
  - 'java'
  - 'sra-toolkit'
  - 'fastqc'
  - 'trimmomatic'
  - 'star'
  - 'bedtools'
  - 'python/3.11'
  - 'sambamba'

jupyterhub::kernel::venv::packages:
  - 'MACS2'
  - 'deepTools'
