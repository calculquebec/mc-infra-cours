jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    runtime:
      min: 3.5
      def: 3.5
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 8
    memory:
      min: 1024
      max: 30000
      def: 2048
    oversubscribe:
      def: true
      lock: false
    ui:
      def: 'lab'
  SlurmFormSpawner:
    disable_form: false

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'
  - 'gcc/12.3'
  - 'mii'
  - 'python/3.12'
  - 'opencv/4.11.0'

jupyterhub::kernel::venv::packages:
  - 'numpy'
  - 'scikit-learn'
  - 'pandas'
  - 'torch'
  - 'torchvision'
  - 'scipy'
  - 'scikit-image'
  - 'scikit-learn'
  - 'networkx'
  - 'matplotlib'
  - 'seaborn'
  - 'cellpose'
  - 'stardist'
  - 'csbdeep'
  - 'tensorflow'
  - 'tifffile'
  - 'h5py'
  - 'tqdm'

jupyterhub::kernel::venv::python: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Compiler/gcccore/python/3.12.4/bin/python3
jupyterhub::kernel::venv::prefix: /opt/ipython-kernel-3.12

jupyterhub::kernel::venv::pip_environment:
  PIP_NO_INDEX: 1
  PYTHONPATH: /cvmfs/soft.computecanada.ca/easybuild/python/site-packages:/cvmfs/soft.computecanada.ca/custom/python/site-packages
  EBPYTHONPREFIXES: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Compiler/gcccore/scipy-stack/2025a:/cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Compiler/gcccore/ipykernel/2025a/:/cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Compiler/gcc12/opencv/4.11.0

jupyterhub::kernel::venv::kernel_environment:
  PYTHONPATH: "/cvmfs/soft.computecanada.ca/easybuild/python/site-packages:${PYTHONPATH}"
  EBPYTHONPREFIXES: "${SLURM_TMPDIR}:${EBPYTHONPREFIXES}"

cron::job:
  spawn_nodes:
    command: '/opt/software/slurm/bin/scontrol update node=ALL state=power_up'
    minute: '55'
    hour: '8'
    date: '4'
    month: '7'
    weekday: '*'
    user: 'root'
    description: 'spawn nodes at 8h55 on July 4th'
    environment: ['CRON_TZ=America/New_York']
  spawn_nodes:
    command: '/opt/software/slurm/bin/scontrol update node=ALL state=power_up'
    minute: '55'
    hour: '6'
    date: '5'
    month: '7'
    weekday: '*'
    user: 'root'
    description: 'spawn nodes at 6:55 on July 5th'
    environment: ['CRON_TZ=America/New_York']
