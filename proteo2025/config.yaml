jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    runtime:
      min: 3.5
      def: 3.5
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 8
    memory:
      min: 1024
      max: 30000
      def: 2048
    oversubscribe:
      def: true
      lock: false
    ui:
      def: 'lab'
  SlurmFormSpawner:
    disable_form: false

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'
  - 'gcc/12.3'
  - 'cuda/12.2'
  - 'mii'
  - 'python/3.11'
  - 'namd-multicore/3.0.1'

jupyterhub::kernel::venv::packages:
  - 'matplotlib'
  - 'pandas'

cron::job:
  spawn_nodes_Aug19:
    command: '/opt/software/slurm/bin/scontrol update node=ALL state=power_up'
    minute: '55'
    hour: '11'
    month: '8'
    day: '19'
    user: 'root'
    description: 'spawn nodes on August 19th at 11:55'
    environment: ['CRON_TZ=America/New_York']
