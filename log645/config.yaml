jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    runtime:
      min: 1.0
      def: 2.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 8
    memory:
      min: 1024
      max: 10000
      def: 6144
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
    partition:
      lock: false
  SlurmFormSpawner:
    disable_form: false

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2020'
  - 'gcc/9.3.0'
  - 'mii/1.1.2'
  - 'openmpi/4.0.3'
  - 'tau/2.30.1'

cron::job:
  spawn_nodes:
    command: '/opt/software/slurm/bin/scontrol update node=nodecpupool[1-2] state=power_up'
    minute: '20'
    hour: '13'
    month: '3-4'
    weekday: '2'
    user: 'root'
    description: 'spawn nodes at 13:20 on each Thuesdays'
    environment: ['CRON_TZ=America/New_York']

  spawn_nodes_march_13:
    command: '/opt/software/slurm/bin/scontrol update node=nodecpupool[1-2] state=power_up'
    minute: '20'
    hour: '8'
    date: '13'
    month: '3'
    weekday: '*'
    user: 'root'
    description: 'spawn nodes at 8:20 on March 13'
    environment: ['CRON_TZ=America/New_York']

  spawn_nodes_march_20:
    command: '/opt/software/slurm/bin/scontrol update node=nodecpupool[1-2] state=power_up'
    minute: '20' 
    hour: '8'
    date: '20'
    month: '3'
    weekday: '*'
    user: 'root'
    description: 'spawn nodes at 8:20 on March 20'
    environment: ['CRON_TZ=America/New_York']

  spawn_nodes_march_27:
    command: '/opt/software/slurm/bin/scontrol update node=nodecpupool[1-2] state=power_up'
    minute: '20'
    hour: '8' 
    date: '27'
    month: '3'  
    weekday: '*'
    user: 'root'
    description: 'spawn nodes at 8:20 on March 27'
    environment: ['CRON_TZ=America/New_York']

  spawn_nodes_aprit_3:
    command: '/opt/software/slurm/bin/scontrol update node=nodecpupool[1-2] state=power_up'
    minute: '20'
    hour: '8'
    date: '3'  
    month: '4'  
    weekday: '*'
    user: 'root'
    description: 'spawn nodes at 8:20 on April 3'
    environment: ['CRON_TZ=America/New_York']
