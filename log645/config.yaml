profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'

cron::job:
  spawn_nodes_mardi:
    command: '/opt/software/slurm/bin/scontrol update node=ALL state=power_up'
    minute: '55'
    hour: '17'
    month: '7-8'
    weekday: '2'
    user: 'root'
    description: 'spawn nodes at 17h55 on each Tuesdays'
    environment: ['CRON_TZ=America/New_York']

  spawn_nodes_jeudi:
    command: '/opt/software/slurm/bin/scontrol update node=ALL state=power_up'
    minute: '55'
    hour: '17'
    month: '7-8'
    weekday: '4'
    user: 'root'
    description: 'spawn nodes at 17h55 on each Thursdays'
    environment: ['CRON_TZ=America/New_York']
