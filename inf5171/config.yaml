jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 1.0
      def: 5.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 1
    memory:
      min: 1024
      max: 15000
      def: 2048
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
    partition:
      lock: false
  SlurmFormSpawner:
    disable_form: true

profile::software_stack::lmod_default_modules:
  - 'StdEnv/2023'
  - 'gcc/12.3'
  - 'openmpi/4.1.5'
  - 'cuda/12.2'
  - 'mii'
